[project]
name = "wagamama-forecast"
version = "0.1.0"
description = "Demand forecasting platform for walk-in-heavy restaurant chains"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "asyncpg>=0.30.0",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "pybreaker>=1.2.0",
    "pandas>=2.2.3",
    "pandera>=0.21.0",
    "python-dateutil>=2.9.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "freezegun>=1.5.1",
]
ml = [
    "lightgbm>=4.5.0",
    "scikit-learn>=1.5.2",
    "mapie>=0.9.1",
    "shap>=0.46.0",
    "mlflow>=2.18.0",
    "numpy>=2.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
